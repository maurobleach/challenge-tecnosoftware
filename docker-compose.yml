services:
  postgres:
    image: postgres:15-alpine
    container_name: challenge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hassan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ecommercedb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hassan} -d ${POSTGRES_DB:-ecommercedb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: