services:
  postgres:
    image: postgres:15-alpine
    container_name: challenge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hassan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ecommercedb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hassan} -d ${POSTGRES_DB:-ecommercedb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./nestjs-ecommerce
      target: dev
    env_file:
      - ./nestjs-ecommerce/.env
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./nestjs-ecommerce:/app
      - backend_node_modules:/app/node_modules

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    profiles: ["prod"]
    build:
      context: ./nestjs-ecommerce
      target: prod
    env_file:
      - ./nestjs-ecommerce/.env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: http://localhost:3000
    env_file:
      - ./frontend/.env
    environment:
      PORT: 5173
      HOST: 0.0.0.0
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  backend_node_modules:
  frontend_node_modules:
